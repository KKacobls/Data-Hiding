name: TPE-DNA 16x16 verification
on:
  push:
    paths:
      - 'tpe_dna_16x16/**'
      - '.github/workflows/tpe-dna-16x16.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 8 random seeds and five categories
        run: python -m unittest discover -s tpe_dna_16x16 -p 'test_*.py' -v
      - name: Generate matrices and report
        run: python tpe_dna_16x16/demo.py --seed 20261110 --output tpe_dna_16x16/output
      - name: Upload Excel-ready data
        uses: actions/upload-artifact@v4
        with:
          name: tpe-dna-16x16-matrices
          path: tpe_dna_16x16/output/
